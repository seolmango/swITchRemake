name: Isolated audit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run the extended browser suite
        type: boolean
        default: true
  schedule:
    - cron: '30 18 * * 0'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AUDIT_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan tracked files for credentials
        run: node scripts/audit-secrets.cjs
      - name: Build and run disposable core stack
        # No application secrets, cloud login, deployment permissions, or production URLs.
        run: node scripts/audit-stack.cjs run core
      - name: Cleanup only this audit project
        if: always()
        run: |
          if test -f ".audit/$AUDIT_RUN_ID/runtime.env"; then
            node scripts/audit-stack.cjs down
          fi
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/artifacts/audit
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false

  extended:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUDIT_RUN_ID: extended-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan tracked files for credentials
        run: node scripts/audit-secrets.cjs
      - name: Build and run disposable extended stack
        run: node scripts/audit-stack.cjs run extended
      - name: Cleanup only this audit project
        if: always()
        run: |
          if test -f ".audit/$AUDIT_RUN_ID/runtime.env"; then
            node scripts/audit-stack.cjs down extended
          fi
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-extended-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/artifacts/audit
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
