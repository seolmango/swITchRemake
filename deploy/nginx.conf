# Docker's embedded resolver keeps upstreams usable after a service is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream match_backend {
    zone match_backend 64k;
    server match:3000 resolve;
}

upstream cluster_backend {
    zone cluster_backend 64k;
    server cluster:4100 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # 원문 IP가 별도 보관기간 없이 컨테이너 로그에 쌓이지 않게 한다. 보안 기록은 앱에서
    # 암호화·HMAC 처리하고 retention 설정에 따라 지운다.
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /api { return 308 /api/; }
    location /api/ {
        # The matching server exposes /auth, /rooms, etc. without /api.
        proxy_pass http://match_backend/;
    }

    location /game-ws {
        proxy_pass http://cluster_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /map-bundles/ {
        proxy_pass http://cluster_backend;
    }

    location /replays/ {
        proxy_pass http://cluster_backend;
        proxy_buffering off;
    }

    # Entry points must revalidate so new deployments are not trapped by an old worker.
    location = /index.html {
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        try_files $uri =404;
    }

    # Vite's generated assets contain content hashes; missing chunks must never serve HTML.
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
