<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="presentation">
  <!--
    점멸(코드상 `flash`) 아이콘. 이름표는 여기 두지 않는다 — 화면에 보이는 이름은 로케일의
    `lobby.skills.*`가 유일한 출처이고, 이 파일이 따로 이름을 들면 둘이 갈라진다.
    점멸. 왼쪽은 점선 윤곽(있던 자리), 오른쪽은 채워진 형태(도착한 자리).
    사이의 파선 두 개가 "건너뛰었다"를 말한다.
    잔상을 절대 넣지 않는다 — 잔상이 붙는 순간 유체화와 구별되지 않는다.
  -->
  <g fill="none" stroke="#9B87D4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="64" r="20" stroke-dasharray="7 11"/>
    <path d="M62 52 L70 64 L62 76"/>
    <path d="M80 52 L88 64 L80 76" opacity="0.55"/>
    <circle cx="104" cy="64" r="16" fill="#CDC1F0"/>
  </g>
</svg>
