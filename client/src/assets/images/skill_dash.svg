<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="presentation">
  <!--
    유체화(코드상 `dash`) 아이콘. 이름표는 여기 두지 않는다 — 화면에 보이는 이름은 로케일의
    `lobby.skills.*`가 유일한 출처이고, 이 파일이 따로 이름을 들면 둘이 갈라진다.
    진행 방향(오른쪽)으로 늘어난 물방울 + 뒤로 흐르는 잔상.
    "빨라진다"가 아니라 "몸이 흘러간다"를 그린다.
    잔상은 이 아이콘에만 있다 — 점멸과 구분되는 유일한 지점이라 빼면 안 된다.
  -->
