services:
  postgres:
    image: "postgres:16-alpine"
    container_name: swITch-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    # 호스트 루프백에만 바인딩한다. 0.0.0.0으로 열면 같은 네트워크의 다른 기기에서 DB에 직접 붙을 수 있다.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: "redis:7-alpine"
    container_name: swITch-redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # appendonly: 재시작해도 데이터가 남는다.
    # appendfsync everysec: 비정상 종료 시 최대 1초치만 유실. 세션과 제어 평면에는 충분하다.
    # requirepass: 비밀번호 없이 뜨면 로컬 네트워크에서 누구나 방 배정과 전적 stream을 조작할 수 있다.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

volumes:
  pg_data:
  redis_data:
