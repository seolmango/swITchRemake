name: switch-internal

x-backend: &backend
  image: switch-internal-backend:local
  env_file:
    - .env.internal
  init: true

x-app-environment: &app-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SWITCH_SKIP_ENV_FILE: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-switch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run the internal environment setup first}
      POSTGRES_DB: ${DB_NAME:-switch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run the internal environment setup first}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    <<: *backend
    # Build the shared image once. Defining this on all three consumers makes
    # Compose export competing copies to the same tag during parallel builds.
    build:
      context: .
      dockerfile: Dockerfile.backend
    pull_policy: build
    command: ["npm", "run", "db:migrate", "-w", "server-match"]
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  match:
    <<: *backend
    pull_policy: never
    restart: unless-stopped
    command: ["node", "server-match/dist/main.js"]
    environment:
      <<: *app-environment
      PORT: "3000"
      MATCH_TRUSTED_PROXIES: ${INTERNAL_SUBNET:-172.29.240.0/24}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  cluster:
    <<: *backend
    pull_policy: never
    restart: unless-stopped
    command: ["node", "docker-cluster.cjs"]
    environment:
      <<: *app-environment
      GAME_HOST: "0.0.0.0"
      GAME_INTERNAL_HOST: "127.0.0.1"
      GAME_MAP_BUNDLE: /app/server-game/maps/server_maps.json
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      GAME_TRUSTED_PROXIES: "127.0.0.1,::1,${INTERNAL_SUBNET:-172.29.240.0/24}"
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "4100"
      GATEWAY_ALLOWED_GAME_HOSTS: "127.0.0.1,localhost,::1"
      REPLAY_STORE: local
      REPLAY_LOCAL_DIR: /app/replays
    volumes:
      - replay_data:/app/replays
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>r.json()).then(v=>{if(!v.ok||v.servers<1)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      match:
        condition: service_healthy
      cluster:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.29.240.0/24}

volumes:
  postgres_data:
  redis_data:
  replay_data:
